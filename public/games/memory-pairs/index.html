<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Pairs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">Moves</span>
            <span id="moves" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Pairs</span>
            <span id="pairs" class="stat-value">0/8</span>
          </div>
          <div class="stat">
            <span class="stat-label">Score</span>
            <span id="score" class="stat-value">0</span>
          </div>
        </div>
        <div class="hud-actions">
          <select id="sizeSelect" class="select-control" aria-label="Board layout">
            <option value="4x4">4×4 (8 Pairs)</option>
            <option value="6x4">6×4 (12 Pairs)</option>
          </select>
          <button id="restartBtn" class="btn-secondary" type="button">Shuffle</button>
          <button id="soundBtn" class="btn-secondary" type="button">Sound: On</button>
        </div>
      </header>

      <main class="stage">
        <div id="grid" class="grid" aria-label="Memory Card Grid"></div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h1>All Pairs Matched!</h1>
            <p id="overlayDesc">Completed in 0 moves.</p>
            <button id="playAgainBtn" class="btn-primary" type="button">Play Again</button>
          </div>
        </div>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
