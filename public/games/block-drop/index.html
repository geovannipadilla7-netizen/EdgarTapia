<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Drop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="layout">
        <div class="board-wrap">
          <canvas id="board" width="260" height="520" aria-label="Block Drop Board"></canvas>
          <div id="overlay" class="overlay">
            <div class="overlay-card">
              <h1 id="overlayTitle">Block Drop</h1>
              <p id="overlayDesc">
                Clear horizontal lines by rotating and stacking falling blocks. Use Hold to save a piece for later.
              </p>
              <p class="controls-note">←/→ Move · ↑ Rotate · ↓ Soft Drop · Space Hard Drop · C Hold</p>
              <button id="startBtn" class="btn-primary" type="button">Start Game</button>
            </div>
          </div>
        </div>

        <aside class="sidebar">
          <div class="panel">
            <span class="label">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="panel">
            <span class="label">Best</span>
            <span id="best" class="value">0</span>
          </div>
          <div class="panel">
            <span class="label">Lines · Level</span>
            <span id="linesLevel" class="value">0 · 1</span>
          </div>

          <div class="panel preview-panel">
            <span class="label">Next</span>
            <canvas id="nextCanvas" width="96" height="72"></canvas>
          </div>

          <div class="panel preview-panel">
            <span class="label">Hold (C)</span>
            <canvas id="holdCanvas" width="96" height="72"></canvas>
          </div>

          <div class="actions">
            <button id="pauseBtn" class="btn-secondary" type="button">Pause</button>
            <button id="soundBtn" class="btn-secondary" type="button">Sound: On</button>
          </div>
        </aside>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
