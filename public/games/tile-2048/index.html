<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tile 2048</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span id="best" class="stat-value">0</span>
          </div>
        </div>
        <div class="hud-actions">
          <button id="undoBtn" class="btn-secondary" type="button" disabled>Undo</button>
          <button id="newBtn" class="btn-secondary" type="button">New Game</button>
          <button id="soundBtn" class="btn-secondary" type="button">Sound: On</button>
        </div>
      </header>

      <main class="stage">
        <div id="grid" class="grid" aria-label="2048 Game Board"></div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h1 id="overlayTitle">You Reached 2048!</h1>
            <p id="overlayDesc">Keep merging tiles for an even higher score, or start a fresh board.</p>
            <div class="overlay-actions">
              <button id="continueBtn" class="btn-secondary hidden" type="button">Keep Going</button>
              <button id="restartBtn" class="btn-primary" type="button">Play Again</button>
            </div>
          </div>
        </div>
      </main>

      <p class="hint-line">Use Arrow Keys, WASD, or swipe the board to slide tiles</p>
    </div>

    <script src="game.js"></script>
  </body>
</html>
