<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minefield</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">Mines Left</span>
            <span id="minesLeft" class="stat-value">10</span>
          </div>
          <div class="stat">
            <span class="stat-label">Time</span>
            <span id="timer" class="stat-value">0s</span>
          </div>
        </div>
        <div class="hud-actions">
          <select id="sizeSelect" class="select-control" aria-label="Board size">
            <option value="9">9×9 (10 Mines)</option>
            <option value="12">12×12 (20 Mines)</option>
            <option value="16">16×16 (40 Mines)</option>
          </select>
          <button id="flagModeBtn" class="btn-secondary" type="button">Mode: Reveal</button>
          <button id="resetBtn" class="btn-secondary" type="button">Reset</button>
        </div>
      </header>

      <main class="stage">
        <div id="board" class="board" aria-label="Minefield Grid"></div>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h1 id="overlayTitle">Board Cleared!</h1>
            <p id="overlayDesc">All safe cells uncovered.</p>
            <button id="playAgainBtn" class="btn-primary" type="button">Play Again</button>
          </div>
        </div>
      </main>

      <p class="hint-line">Left click to reveal · Right click (or toggle Mode) to place a flag</p>
    </div>

    <script src="game.js"></script>
  </body>
</html>
