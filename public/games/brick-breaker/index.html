<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Breaker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="hud-stats">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span id="best" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Stage</span>
            <span id="stageNum" class="stat-value">1/3</span>
          </div>
          <div class="stat">
            <span class="stat-label">Lives</span>
            <span id="lives" class="stat-value">3</span>
          </div>
        </div>
        <div class="hud-actions">
          <button id="pauseBtn" class="btn-secondary" type="button">Pause</button>
          <button id="soundBtn" class="btn-secondary" type="button">Sound: On</button>
        </div>
      </header>

      <main class="stage">
        <canvas id="board" width="600" height="440" aria-label="Brick Breaker Arena"></canvas>

        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <h1 id="overlayTitle">Brick Breaker</h1>
            <p id="overlayDesc">
              Bounce the kinetic orb to shatter every brick across 3 stages. Silver bricks take 2 hits; catch amber drops for a wide paddle.
            </p>
            <p class="controls-note">Move with Mouse, Touch, or Arrow Keys · Space to Launch / Pause</p>
            <button id="startBtn" class="btn-primary" type="button">Start Game</button>
          </div>
        </div>
      </main>
    </div>

    <script src="game.js"></script>
  </body>
</html>
